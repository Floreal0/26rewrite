<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>「办公楼·扩建版」地图 · 可视化</title>
<style>
  body { margin:0; min-height:100vh; background:#EDF1F9; color:#2B3040;
         font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:#7A8199; font-size:14px; margin-bottom:18px; text-align:center; }
  canvas { width:100%; max-width:1200px; border-radius:16px;
           box-shadow:0 12px 34px rgba(38,50,72,.16); background:#fff; }
  .legend { display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:18px;
            font-size:13px; align-items:center; justify-content:center; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .sw { width:16px; height:16px; border-radius:4px; display:inline-block;
        border:1px solid rgba(15,18,38,.15); }
  .status { margin-top:12px; font-size:13px; color:#7A8199; min-height:18px; }
</style>
</head>
<body>
<h1>🏢 「办公楼·扩建版」 <span style="font-size:14px;color:#7A8199">56 × 40 格 · 每格 32px · 视野半径 12 格</span></h1>
<div class="sub">悬停查看格子信息 · 数字圆圈为出生点(共 10 个,开局朝墙)</div>
<canvas id="cv" width="1856" height="1312"></canvas>
<div class="legend">
  <span><i class="sw" style="background:#2E3448"></i>墙体</span>
  <span><i class="sw" style="background:#F7F9FD"></i>地板</span>
  <span><i class="sw" style="background:#FFC24B"></i>门洞</span>
  <span><i class="sw" style="background:#8A93A8"></i>掩体箱</span>
  <span><i class="sw" style="background:#7C5CFF;border-radius:50%"></i>出生点 1~10</span>
</div>
<div class="status" id="status">&nbsp;</div>

<script>
const MAP = {
  name: "办公楼·扩建版", w: 56, h: 40,
  rooms: [
    ["TL 左上房",1,1,8,8], ["LS 西储物间",1,10,8,6],
    ["BL 西楼梯间北",1,17,8,8], ["SW 西楼梯间南",1,27,8,12],
    ["西走廊",10,1,4,38], ["中央大厅",15,1,10,31],
    ["大会议室",15,33,10,6], ["东走廊",26,1,4,38],
    ["TR 右上房",31,1,8,8], ["MR 东储物间",31,10,8,6],
    ["BR 右楼梯间北",31,17,8,8], ["开放办公区",31,27,24,12],
    ["北档案室",40,3,15,9], ["南档案室",40,13,15,10]
  ],
  doors: [[9,3],[9,4],[9,11],[9,12],[9,18],[9,19],
          [14,5],[14,6],[14,16],[14,17],[14,10],[14,11],
          [25,5],[25,6],[25,18],[25,19],[25,13],[25,14],
          [30,3],[30,4],[30,11],[30,12],[30,18],[30,19],
          [9,29],[9,30],[9,35],[9,36],
          [19,32],[20,32],[30,29],[30,30],
          [39,5],[39,6],[39,18],[39,19],[47,12]],
  crates: [[17,5],[22,8],[16,13],[21,16],[18,21],[19,11],
           [4,4],[35,4],[4,20],[35,20],
           [20,28],[17,34],[22,36],[4,30],[6,35],
           [34,30],[40,33],[46,29],[50,35],[43,37],
           [45,6],[51,9],[44,16],[51,19]],
  spawns: [[2,2],[37,2],[2,23],[37,23],[11,12],[28,12],
           [19,36],[4,32],[47,32],[47,7]]
};

const CELL = 32, PAD = 16;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
cv.width  = PAD*2 + MAP.w * CELL;
cv.height = PAD*2 + MAP.h * CELL;

ctx.fillStyle = "#2E3448";
ctx.fillRect(0, 0, cv.width, cv.height);

for (const [, x, y, w, h] of MAP.rooms) {
  ctx.fillStyle = "#F7F9FD";
  ctx.fillRect(PAD + x*CELL, PAD + y*CELL, w*CELL, h*CELL);
}
ctx.strokeStyle = "rgba(15,18,38,.06)";
ctx.lineWidth = 1;
for (let x = 0; x <= MAP.w; x++) {
  ctx.beginPath();
  ctx.moveTo(PAD + x*CELL + .5, PAD);
  ctx.lineTo(PAD + x*CELL + .5, cv.height - PAD);
  ctx.stroke();
}
for (let y = 0; y <= MAP.h; y++) {
  ctx.beginPath();
  ctx.moveTo(PAD, PAD + y*CELL + .5);
  ctx.lineTo(cv.width - PAD, PAD + y*CELL + .5);
  ctx.stroke();
}

for (const [x, y] of MAP.doors) {
  const px = PAD + x*CELL, py = PAD + y*CELL;
  ctx.fillStyle = "#FFC24B";
  ctx.beginPath();
  ctx.roundRect(px+3, py+3, CELL-6, CELL-6, 6);
  ctx.fill();
}

for (const [x, y] of MAP.crates) {
  const px = PAD + x*CELL, py = PAD + y*CELL;
  ctx.fillStyle = "#8A93A8";
  ctx.beginPath();
  ctx.roundRect(px+3, py+3, CELL-6, CELL-6, 7);
  ctx.fill();
  ctx.strokeStyle = "rgba(15,18,38,.35)";
  ctx.strokeRect(px+9.5, py+9.5, CELL-19, CELL-19);
}

MAP.spawns.forEach(([x, y], i) => {
  const cx = PAD + x*CELL + CELL/2, cy = PAD + y*CELL + CELL/2;
  ctx.fillStyle = "#7C5CFF";
  ctx.beginPath(); ctx.arc(cx, cy, CELL*0.38, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold " + Math.floor(CELL*0.42) + "px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(i+1), cx, cy+1);
});

/* 房间名 */
ctx.font = "600 14px sans-serif";
ctx.fillStyle = "#7A8199";
ctx.textAlign = "center"; ctx.textBaseline = "middle";
const labels = [
  [5,5,"左上房"],[5,13,"西储物间"],[5,21,"西楼梯间北"],[5,32,"西楼梯间南"],
  [12,20,"西走廊"],[20,16,"中 央 大 厅"],[20,36,"大会议室"],
  [28,20,"东走廊"],[35,5,"右上房"],[35,13,"东储物间"],[35,21,"右楼梯间北"],
  [43,32,"开放办公区"],[47,7,"北档案室"],[47,18,"南档案室"]
];
labels.forEach(([x,y,t]) => ctx.fillText(t.split("").join(" "), PAD + x*CELL + CELL/2, PAD + y*CELL + CELL/2));

/* 悬停状态栏 */
const TYPES = { wall:"墙体", floor:"地板", door:"门洞", crate:"掩体箱" };
const isDoor = new Set(MAP.doors.map(([x,y]) => x+","+y));
const isCrate = new Set(MAP.crates.map(([x,y]) => x+","+y));
const spawnAt = new Map(MAP.spawns.map(([x,y],i) => [x+","+y, i+1]));
cv.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect();
  const scale = cv.width / r.width;
  const mx = (e.clientX - r.left) * scale, my = (e.clientY - r.top) * scale;
  const x = Math.floor((mx - PAD) / CELL), y = Math.floor((my - PAD) / CELL);
  const st = document.getElementById("status");
  if (x < 0 || y < 0 || x >= MAP.w || y >= MAP.h) { st.innerHTML = "&nbsp;"; return; }
  const key = x+","+y;
  let type = "wall";
  if (isDoor.has(key)) type = "door";
  else if (isCrate.has(key)) type = "crate";
  else if (MAP.rooms.some(([,rx,ry,rw,rh]) => x>=rx && x<rx+rw && y>=ry && y<ry+rh)) type = "floor";
  let extra = "";
  if (spawnAt.has(key)) extra = " · 出生点 " + spawnAt.get(key);
  const rn = MAP.rooms.find(([,rx,ry,rw,rh]) => x>=rx && x<rx+rw && y>=ry && y<ry+rh);
  st.textContent = `(${x}, ${y}) · ${TYPES[type]}${rn ? " · " + rn[0] : ""}${extra}`;
});
cv.addEventListener("mouseleave", () => document.getElementById("status").innerHTML = "&nbsp;");
</script>
</body>
</html>
