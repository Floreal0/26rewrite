<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CQB 2048… 不对,CQB 战术行动 · 原型一期</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#05070C; }
  #cv { display:block; width:100vw; height:100vh; cursor:none; }
  .hud { position:fixed; font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
         color:#E8ECF5; pointer-events:none; z-index:5; }
  #chips { top:14px; left:16px; display:flex; gap:10px; font-size:14px; }
  .chip { background:rgba(10,14,24,.72); border:1px solid rgba(124,92,255,.25);
          border-radius:10px; padding:6px 14px; }
  .chip b { color:#CFD3FF; }
  #killfeed { top:14px; right:16px; text-align:right; font-size:13px; }
  #killfeed div { margin-bottom:4px; background:rgba(10,14,24,.6);
                  padding:4px 10px; border-radius:8px; }
  #weapon { bottom:26px; right:22px; text-align:right; }
  #wname { font-size:16px; font-weight:700; letter-spacing:1px; }
  #ammo { font-size:30px; font-weight:700; color:#CFD3FF; }
  #reload { width:150px; height:5px; background:rgba(255,255,255,.15);
            border-radius:3px; margin-top:6px; margin-left:auto; overflow:hidden; }
  #reloadFill { height:100%; width:0%; background:#FFC24B; }
  #hpwrap { bottom:26px; left:50%; transform:translateX(-50%); width:280px; }
  #hpbg { height:12px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
  #hpfill { height:100%; width:100%; background:#5AD07A; transition:width .12s; }
  #hptext { font-size:12px; text-align:center; margin-top:4px; color:#B9BEE8; }
  #center { inset:0; display:flex; align-items:center; justify-content:center;
            flex-direction:column; background:rgba(4,6,12,.66); z-index:8; }
  #center h2 { font-size:44px; margin:0 0 10px; }
  #center p { color:#B9BEE8; margin:0 0 24px; font-size:16px; }
  #center button { pointer-events:auto; background:#7C5CFF; color:#fff; border:none;
                   border-radius:10px; padding:12px 30px; font-size:17px; cursor:pointer; }
  #center.hidden, #respawnTxt.hidden { display:none; }
  #respawnTxt { inset:0; display:flex; align-items:center; justify-content:center;
                font-size:30px; font-weight:700; color:#FF7B7B;
                text-shadow:0 2px 12px rgba(0,0,0,.8); z-index:7; }
  #vignette { inset:0; background:radial-gradient(circle, transparent 55%,
              rgba(255,40,40,.55)); opacity:0; transition:opacity .25s; z-index:6; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="chips">
  <div class="chip">击杀 <b id="kills">0</b> / 15</div>
  <div class="chip">死亡 <b id="deaths">0</b></div>
</div>
<div class="hud" id="killfeed"></div>
<div class="hud" id="weapon">
  <div id="wname">步枪</div>
  <div id="ammo"><span id="mag">30</span><span style="font-size:14px;color:#8E93B0"> / ∞</span></div>
  <div id="reload"><div id="reloadFill"></div></div>
</div>
<div class="hud" id="hpwrap">
  <div id="hpbg"><div id="hpfill"></div></div>
  <div id="hptext">100 / 100</div>
</div>
<div class="hud" id="vignette"></div>
<div class="hud hidden" id="respawnTxt"></div>
<div class="hud" id="center">
  <h2 id="ovTitle">战术行动</h2>
  <p id="ovText">消灭 BOT,率先达成 15 杀。<br>WASD 移动 · 鼠标瞄准射击 · 1/2/3 切枪 · R 换弹 · Shift 静步</p>
  <button id="startBtn">开始行动</button>
</div>

<script src="cqb1.js"></script>
</body>
</html>
